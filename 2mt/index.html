<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      #time {
        font-size: 2em;
        margin-bottom: 20px;
      }
      button {
        font-size: 1em;
        padding: 10px 20px;
        margin-right: 10px;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-family: Arial, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="time">00:00.00</div>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
    <script>
      // time should be hidden after 5 seconds
      // should alert at 2 minutes
      let timeElement = document.getElementById("time");
      let startButton = document.getElementById("start");
      let stopButton = document.getElementById("stop");

      let timer;
      let startTime;

      stopButton.disabled = true; // Disable stop button initially
      startButton.addEventListener("click", () => {
        startTime = Date.now();
        timer = setInterval(() => {
          let elapsedTime = Date.now() - startTime;
          let minutes = Math.floor(elapsedTime / 60000);
          let seconds = Math.floor((elapsedTime % 60000) / 1000);
          let milliseconds = Math.floor((elapsedTime % 1000) / 10);
          timeElement.textContent =
            seconds >= 5
              ? "Running"
              : `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}.${String(milliseconds).padStart(2, "0")}`;

          if (elapsedTime >= 120000) {
            // Alert at 2 minutes
            timeElement.textContent = "2 minutes have passed!";
          }
        }, 10);
        startButton.disabled = true; // Disable start button while timer is running
        stopButton.disabled = false; // Enable stop button while timer is running
      });
      stopButton.addEventListener("click", () => {
        startButton.disabled = false; // Re-enable start button when timer is stopped
        stopButton.disabled = true; // Disable stop button when timer is stopped
        clearInterval(timer);
        timeElement.style.display = "block"; // Show time again when stopped
        let elapsedTime = Date.now() - startTime;
        let minutes = Math.floor(elapsedTime / 60000);
        let seconds = Math.floor((elapsedTime % 60000) / 1000);
        let milliseconds = Math.floor((elapsedTime % 1000) / 10);
        timeElement.textContent = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}.${String(milliseconds).padStart(2, "0")}`;
      });
    </script>
  </body>
</html>
